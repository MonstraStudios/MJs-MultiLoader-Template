pluginManagement {

    repositories {
        gradlePluginPortal()

        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        maven {
            name = 'Sponge, Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }

        mavenCentral()
    }

}


rootProject.name = "MJs-MultiLoader-Template"

include(
        "common",
        "fabric",
        "forge")
