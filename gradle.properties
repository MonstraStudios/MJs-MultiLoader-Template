# these Properties are expanded in root/buildSrc/src/main/groovy/multiloader-common.gradle


# Gradle
org.gradle.jvmargs = -Xmx1G
org.gradle.daemon = false


# Java
java_version = 17


# Main
version = 1.0.0
group = com.myname.mymod


# Mod
mod_id = mymod
mod_name = My Mod
minecraft_version = 1.18.2

mod_license = license
mod_authors = MyName
mod_credits = made by MyName
mod_description = mymod description.
mod_icon = mod_icon.png


# Forge
forge_version = 40.3.0
forge_loader_version_range = [40,)
forge_minecraft_version_range = [1.18.2,1.19)


# Fabric
fabric_api_version = 0.77.0+1.18.2
fabric_loader_version = 0.18.3


# Extra
mod_web_homepage =
mod_web_update_json =
mod_web_source =
mod_web_issue_tracker =


# Mapping
use_parchment_mappings = true
parchment_version = 2022.11.06
parchment_minecraft_version = 1.18.2


# Jar
sources_jar_enabled = true
javadoc_jar_enabled = true



## Links for Properties listed above -

# Forge - https://files.minecraftforge.net/net/minecraftforge/forge/
# Fabric - https://fabricmc.net/develop/
# Parchment - https://parchmentmc.org/docs/getting-started#choose-a-version