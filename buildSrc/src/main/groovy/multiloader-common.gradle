plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}


base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}


java {

    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)


    // Sources & Javadoc Jar
    if (providers.gradleProperty("sources_jar_enabled").orNull?.toBoolean()) {
        withSourcesJar()
    }

    if (providers.gradleProperty("javadoc_jar_enabled").orNull?.toBoolean()) {
        withJavadocJar()
    }

}


repositories {
    mavenCentral()

    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

}


// Process Resources
tasks.withType(ProcessResources).configureEach {

    filteringCharset = 'UTF-8'

    var expandVars = [
            // java
            "java_version": java_version,

            // main
            "version": version,
            "group": project.group,

            // mod
            "mod_id": mod_id,
            "mod_name": mod_name,
            "minecraft_version": minecraft_version,
            "mod_license": mod_license,
            "mod_authors": mod_authors,
            "mod_credits": mod_credits,
            "mod_description": mod_description,
            "mod_icon": mod_icon,

            // forge
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "forge_minecraft_version_range": forge_minecraft_version_range,

            // fabric
            "fabric_api_version": fabric_api_version,
            "fabric_loader_version": fabric_loader_version,

            // extra
            "mod_web_homepage": mod_web_homepage,
            "mod_web_update_json": mod_web_update_json,
            "mod_web_source": mod_web_source,
            "mod_web_issue_tracker": mod_web_issue_tracker
    ]

    var jsonExpandVars = expandVars.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }


    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandVars
    }

    filesMatching(['META-INF/mods.toml']) {
        expand expandVars
    }

    inputs.properties(expandVars)

}


// Java Compile
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = (java_version as int)
}


// Jar
tasks.withType(Jar).configureEach {

    from(rootProject.file("LICENSE")) {
        rename {"${mod_id}.licence.txt"}
    }

    manifest {
        attributes([
                "Specification-Title": mod_name,
                "Specification-Version": version,
                "Specification-Vendor": mod_authors,
                "Implementation-Title": "${mod_id}-${version}-${project.name}",
                "Implementation-Version": version,
                "Implementation-Vendor": mod_authors,
                "Built-On-Minecraft": minecraft_version,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}


// Elements & Loader Attributes
def loaderAttribute = Attribute.of(
        'mc.gradleconventions.loader',
        String
)


if (!extensions.extraProperties.has("multiLoader")) {
    extensions.extraProperties.set("multiLoader", [:])
}

afterEvaluate {

    def loader = project.multiLoader.loaderName ?: project.name

    
    ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
        configurations.findByName(variant)?.outgoing {
            capability("$group:${project.name}:$version")
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }


    ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
        configurations.findByName(variant)?.attributes {
            attribute(loaderAttribute, loader)
        }
    }


    sourceSets.configureEach {
        [
                it.compileClasspathConfigurationName,
                it.runtimeClasspathConfigurationName,
                it.getTaskName(null, 'jarJar')
        ].each { cfg ->
            configurations.findByName(cfg)?.attributes {
                attribute(loaderAttribute, loader)
            }
        }
    }

}


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}